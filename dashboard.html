<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>Triplez Dashboard</title>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="flex">
        <!-- Sidebar -->
        <nav class="w-64 bg-gray-800 h-screen p-6 hidden md:block border-r border-gray-700">
            <h2 class="text-xl font-bold text-cyan-400 mb-8">TriplezOption</h2>
            <ul class="space-y-4">
                <li class="text-cyan-400"><i class="fas fa-th-large mr-2"></i> Dashboard</li>
                <li class="hover:text-cyan-400 cursor-pointer"><a href="tracker.html"><i class="fas fa-chart-line mr-2"></i> Live Prices</a></li>
                <li class="hover:text-cyan-400 cursor-pointer"><a href="index.html"><i class="fas fa-sign-out-alt mr-2"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main -->
        <main class="flex-1 p-8">
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-2xl font-bold">Portfolio Overview</h1>
                <!-- WALLET BUTTON -->
                <button onclick="connectWallet()" id="wallet-btn" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold">
                    Connect Wallet
                </button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                    <p class="text-gray-400">Total Invested</p>
                    <h2 class="text-3xl font-bold">$0.00</h2>
                </div>
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                    <p class="text-gray-400">Daily Profits</p>
                    <h2 class="text-3xl font-bold text-green-500">+$0.00</h2>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                <h3 class="font-bold mb-4">Quick Actions</h3>
                <div class="flex gap-4">
                    <button class="bg-cyan-500 text-slate-900 px-6 py-2 rounded font-bold">Deposit</button>
                    <button class="bg-gray-700 px-6 py-2 rounded font-bold">Withdraw</button>
                </div>
            </div>
        </main>
    </div>

    <script>
    async function connectWallet() {
        if (window.ethereum) {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                document.getElementById('wallet-btn').innerText = "Account: " + accounts[0].substring(0, 6) + "...";
            } catch (err) { alert("Connection rejected"); }
        } else {
            alert("Please use a Crypto Browser or Trust Wallet");
        }
    }
    </script>
</body>
</html>
