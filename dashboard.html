<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Triplez Dashboard</title>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
    <header class="flex justify-between items-center mb-10">
        <h1 class="text-2xl font-bold text-cyan-400">TriplezOption</h1>
        <button onclick="alert('Connecting to Wallet...')" class="bg-yellow-500 text-black px-4 py-2 rounded-lg font-bold">Connect Wallet</button>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
        <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700">
            <p class="text-gray-400">Portfolio Balance</p>
            <h2 class="text-4xl font-bold text-white">$0.00</h2>
        </div>
        <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700">
            <p class="text-gray-400">Active Investments</p>
            <h2 class="text-4xl font-bold text-green-500">None</h2>
        </div>
    </div>

    <div class="flex flex-col gap-4">
        <a href="https://www.moonpay.com/buy" target="_blank" class="bg-cyan-500 text-center text-slate-900 py-4 rounded-xl font-bold text-lg">Buy Crypto Now</a>
        <a href="tracker.html" class="bg-gray-700 text-center py-4 rounded-xl font-bold text-lg">Check Market Prices</a>
        <a href="index.html" class="text-center text-gray-500 mt-4 underline">Logout</a>
    </div>
</body>
</html>
