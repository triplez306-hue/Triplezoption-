<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Crypto Live Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-10 rounded-3xl shadow-2xl border border-gray-700 text-center">
        <h1 class="text-2xl font-bold text-gray-400 mb-4">Bitcoin (BTC) Price</h1>
        <div id="btc-price" class="text-6xl font-black text-yellow-500">
            Loading...
        </div>
        <p class="mt-4 text-sm text-gray-500 italic">Updates automatically every 30 seconds</p>
    </div>

    <script>
        // Function to go get the price
        async function getPrices() {
            try {
                // We are "fetching" data from CoinGecko's free public API
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
                const data = await response.json();
                
                // Extract the price from the data
                const price = data.bitcoin.usd;
                
                // Update the text on our website
                document.getElementById('btc-price').innerText = '$' + price.toLocaleString();
            } catch (error) {
                console.log("Error fetching price:", error);
                document.getElementById('btc-price').innerText = "Offline";
            }
        }

        // Run the function as soon as the page opens
        getPrices();

        // Refresh the price every 30 seconds
        setInterval(getPrices, 30000);
    </script>
</body>
</html>
