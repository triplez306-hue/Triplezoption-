<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Market Live | TriplezOption</title>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
    <a href="dashboard.html" class="mb-10 text-cyan-400 underline font-bold">← Back to Dashboard</a>
    
    <div class="bg-gray-800 p-10 rounded-3xl border border-gray-700 text-center w-80">
        <h1 class="text-xl font-bold text-gray-400 mb-2">Bitcoin Price</h1>
        <div id="price" class="text-4xl font-black text-yellow-500">Loading...</div>
        <div id="eth-price" class="text-2xl font-bold text-indigo-400 mt-4">Loading ETH...</div>
    </div>

    <script>
        async function fetchPrices() {
            const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd');
            const data = await res.json();
            document.getElementById('price').innerText = '$' + data.bitcoin.usd.toLocaleString();
            document.getElementById('eth-price').innerText = 'ETH: $' + data.ethereum.usd.toLocaleString();
        }
        fetchPrices();
        setInterval(fetchPrices, 20000); // Update every 20 seconds
    </script>
</body>
</html>
