<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Live Prices</title>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-6">
    <div class="bg-gray-800 p-10 rounded-3xl border border-gray-700 text-center w-full max-w-sm">
        <h1 class="text-gray-400 font-bold mb-4">LIVE BITCOIN PRICE</h1>
        <div id="price" class="text-5xl font-black text-yellow-500 mb-6">Loading...</div>
        <a href="dashboard.html" class="text-cyan-400 underline font-bold">Back to Dashboard</a>
    </div>

    <script>
        async function getPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('price').innerText = '$' + data.bitcoin.usd.toLocaleString();
            } catch (e) {
                document.getElementById('price').innerText = "Network Error";
            }
        }
        getPrice();
        setInterval(getPrice, 10000);
    </script>
</body>
</html>
